<div class="card">
    <div class="card-body">
        <div class="row">
            <div class="col-md-6">
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal"><i class="bi bi-clipboard-plus"></i> Add Task</button>
            </div>
        </div>
        <div class="table-responsive mt-3">
            <table class="table table-hover task-table table-striped">
                <thead>
                    <tr>
                        <td class="task-col">Task</td>
                        <td class="description-col">Description</td>
                        <td>Priority</td>
                        <td>Status</td>
                        <td>Date</td>
                        <td></td>
                    </tr>
                </thead>
                <tbody>
                    @if(tasks().length === 0) {
                        <tr>
                            <td colspan="6" class="text-center">No tasks available</td>
                        </tr>
                    }
                    @else {
                        @for(task of tasks(); track task.id) {
                            <tr>
                                <td class="task-col">{{ task.task }}</td>
                                <td class="description-col">{{ task.description }}</td>
                                <td>{{ task.priority }}</td>
                                <td>{{ task.status }}</td>
                                <td>{{ task.dueDate | date:'dd MMM yyyy' }}</td>
                                <td class="text-end">
                                    <button class="btn btn-danger" (click)="onDeleteClick(task.id)"><i class="bi bi-trash"></i> Delete</button>
                                </td>
                            </tr>
                        }
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true"
    data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addTaskModalLabel">Add Task</h5>
            </div>
            <div class="modal-body">
                <app-task (taskSaved)="loadTasks()"></app-task>
            </div>
        </div>
    </div>
</div>

<ngx-spinner type="ball-scale-multiple"></ngx-spinner>
